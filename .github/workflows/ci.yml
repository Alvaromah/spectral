name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SJASMPLUS_VERSION: 1.23.1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache sjasmplus
        id: cache-sjasmplus
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sjasmplus
          key: sjasmplus-${{ env.SJASMPLUS_VERSION }}-${{ runner.os }}

      - name: Build sjasmplus from source
        if: steps.cache-sjasmplus.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/sjasmplus-src.tar.xz \
            "https://github.com/z00m128/sjasmplus/releases/download/v${SJASMPLUS_VERSION}/sjasmplus-${SJASMPLUS_VERSION}-src.tar.xz"
          tar xf /tmp/sjasmplus-src.tar.xz -C /tmp
          make -C "/tmp/sjasmplus-${SJASMPLUS_VERSION}" -j4
          mkdir -p ~/.local/bin
          cp "/tmp/sjasmplus-${SJASMPLUS_VERSION}/sjasmplus" ~/.local/bin/

      - name: Add sjasmplus to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Early warning when zx-generation internals drift from our pinned 1.0.1:
  # install latest and run the core suite against it.
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tests/core includes sjasmplus-backed specs (disasm round-trip, symbols)
      - name: Cache sjasmplus
        id: cache-sjasmplus
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sjasmplus
          key: sjasmplus-${{ env.SJASMPLUS_VERSION }}-${{ runner.os }}

      - name: Build sjasmplus from source
        if: steps.cache-sjasmplus.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/sjasmplus-src.tar.xz \
            "https://github.com/z00m128/sjasmplus/releases/download/v${SJASMPLUS_VERSION}/sjasmplus-${SJASMPLUS_VERSION}-src.tar.xz"
          tar xf /tmp/sjasmplus-src.tar.xz -C /tmp
          make -C "/tmp/sjasmplus-${SJASMPLUS_VERSION}" -j4
          mkdir -p ~/.local/bin
          cp "/tmp/sjasmplus-${SJASMPLUS_VERSION}/sjasmplus" ~/.local/bin/

      - name: Add sjasmplus to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm install zx-generation@latest
      - run: npx vitest run tests/core
